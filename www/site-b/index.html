<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site B</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="hero">
	<h1>Site B</h1>
	<p class="lede">
		You are looking at the <strong>second virtual host</strong>. It shares the
		same interface and port as the main site &mdash; the server picked it using
		the <code>Host</code> request header.
	</p>
</header>

<section>
	<h2>How to reach it</h2>
	<pre><code>curl -H "Host: site-b.local" http://127.0.0.1:8080/</code></pre>
</section>
</body>
</html>
