# E08-T06 — virtual hosting.
#
# Os dois primeiros servers compartilham a MESMA porta (8080) e se distinguem
# só pelo header Host: é esse caso que exercita o compartilhamento de listening
# socket, e foi exatamente ele que revelou o BUG-01-04. O terceiro, em outra
# porta, cobre o caso trivial de listeners independentes.

server {
    listen 8080;
    server_name site-a.local;
    root ./www/vhost-a;
    index index.html;
    location / { methods GET; }
}

server {
    listen 8080;
    server_name site-b.local;
    root ./www/vhost-b;
    index index.html;
    location / { methods GET; }
}

server {
    listen 8081;
    server_name outra-porta.local;
    root ./www;
    index index.html;
    location / { methods GET; }
}
