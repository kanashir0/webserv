server {
    listen        8080;
    server_name   localhost;
    root          ./www;
    index         index.html;
    client_max_body_size 1m;

    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;
    error_page 500 /errors/500.html;

    location / {
        methods GET;
        autoindex off;
    }

    location /upload {
        methods GET POST DELETE;
        upload_store ./www/uploads;
        client_max_body_size 10m;
    }

    location /old {
        return 301 /;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .py /usr/bin/python3;
    }

    # Scripts do curl-suite: env_dump.py prova QUERY_STRING, post_echo.py prova
    # que o body chega no stdin do CGI.
    location /cgi-test {
        methods GET POST;
        root ./tests/cgi;
        cgi .py /usr/bin/python3;
    }
}
