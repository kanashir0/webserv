###############################################################################
# Default configuration - demonstrates every mandatory feature.
#
#   ./webserv conf/default.conf
#
# Three server blocks: two virtual hosts sharing 127.0.0.1:8080 (selected by
# the Host header) and a second site on a different interface and port.
###############################################################################


###############################################################################
# Main site - 127.0.0.1:8080, default virtual host
###############################################################################
server {
    listen        127.0.0.1:8080;
    server_name   localhost;

    root          ./www;
    index         index.html;

    # Server-wide ceiling; a location may raise or lower it.
    client_max_body_size 1m;

    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Static site.
    location / {
        methods GET;
        autoindex off;
    }

    # Directory listing: no index file here, so autoindex generates one.
    location /files {
        methods GET;
        autoindex on;
    }

    # Uploads. GET is allowed so an uploaded file can be downloaded again,
    # and the body limit is raised well above the server default.
    location /upload {
        methods GET POST DELETE;
        root ./www/uploads;
        upload_store ./www/uploads;
        autoindex on;
        client_max_body_size 10m;
    }

    # HTTP redirect.
    location /old {
        return 301 /;
    }

    # CGI. Scripts run with their own directory as the working directory.
    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .py /usr/bin/python3;
    }

    # Bonus: cookie-backed session counter. Handled internally by the server,
    # so this location only needs to allow GET.
    location /session {
        methods GET;
    }
}


###############################################################################
# Second virtual host - same interface:port, selected by the Host header
#   curl -H "Host: site-b.local" http://127.0.0.1:8080/
###############################################################################
server {
    listen        127.0.0.1:8080;
    server_name   site-b.local;

    root          ./www/site-b;
    index         index.html;

    client_max_body_size 1m;

    error_page 404 /errors/404.html;

    location / {
        methods GET;
    }
}


###############################################################################
# Third site - different interface and port
#   curl http://127.0.0.2:8081/
###############################################################################
server {
    listen        127.0.0.2:8081;
    server_name   third.local;

    root          ./www;
    index         index.html;

    error_page 404 /errors/404.html;

    location / {
        methods GET;
        autoindex on;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .py /usr/bin/python3;
    }
}
