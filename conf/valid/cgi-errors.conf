# CGI error handling. The server must survive all of these and answer with a
# proper status code instead of hanging or crashing:
#
#   curl http://127.0.0.1:8090/cgi-bin/hello.py    -> 200 OK
#   curl http://127.0.0.1:8090/cgi-bin/loop.py     -> 504 Gateway Timeout (~10s)
#   curl http://127.0.0.1:8090/cgi-bin/exit.py     -> 502 Bad Gateway
#   curl http://127.0.0.1:8090/cgi-bin/broken.py   -> 502 Bad Gateway
server {
    listen 127.0.0.1:8090;
    server_name cgi.local;

    root  ./www;
    index index.html;

    error_page 502 /errors/500.html;
    error_page 504 /errors/500.html;

    location / {
        methods GET;
    }

    location /cgi-bin {
        methods GET POST;
        root ./cgi-bin;
        cgi .py /usr/bin/python3;
    }
}
