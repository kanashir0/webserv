# Three independent sites: two ports on 127.0.0.1 and a third interface.
# Each one serves a different document root.
server {
    listen 127.0.0.1:8085;
    server_name first.local;

    root  ./www;
    index index.html;

    location / {
        methods GET;
    }
}

server {
    listen 127.0.0.1:8086;
    server_name second.local;

    root  ./www/site-b;
    index index.html;

    location / {
        methods GET;
    }
}

server {
    listen 127.0.0.2:8087;
    server_name third.local;

    root ./www/files;

    location / {
        methods GET;
        autoindex on;
    }
}
