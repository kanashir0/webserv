server {
    listen 8080;
    root ./www;
    index index.html;
    client_max_body_size 0;

    error_page 404 ./www/errors/404.html;
    error_page 405 ./www/errors/405.html;
    error_page 413 ./www/errors/413.html;

    location / {
        methods GET;
        autoindex off;
    }

    location /directory {
        methods GET POST;
        root ./YoupiBanane;
        index youpi.bad_extension;
        cgi .bla ./cgi_tester;
    }

    location /post_body {
        methods GET POST;
        client_max_body_size 100;
	upload_store ./www/uploads;
    }
}